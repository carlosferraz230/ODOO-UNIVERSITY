services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=university_db
      - POSTGRES_USER=university_admin
      - POSTGRES_PASSWORD=carloS@925192810
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:15
    depends_on:
      - db
    ports:
      - "8088:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./etc:/etc/odoo
      - ./addons:/mnt/extra-addons
      - ./requirements.txt:/tmp/requirements.txt
    command: sh -c "pip3 install --no-cache-dir -r /tmp/requirements.txt && ./entrypoint.sh odoo"
    restart: unless-stopped

volumes:
  db_data:
  odoo_data:

